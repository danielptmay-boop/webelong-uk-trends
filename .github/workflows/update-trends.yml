name: Refresh verified UK TikTok trends
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/London
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uk-tiktok-trends-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect UK hashtags and sound discoveries
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/update_trends.py
      - name: Commit verified feed if updated
        run: |
          git config user.name 'we-belong-trends-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/uk-tiktok-trends.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update verified UK trends feed'
            git push
          fi
